name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high


  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source contracts and boundaries
        run: bash scripts/ci.sh source
      - name: Restore and build
        run: bash scripts/ci.sh build
      - name: Verify formatting
        run: bash scripts/ci.sh format
      - name: Validate generated OpenAPI
        run: bash scripts/ci.sh contract
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-contract
          path: |
            artifacts/verification/openapi.json
            artifacts/verification/operation-links.json
            artifacts/verification/flows.json
            artifacts/verification/validation-policies.json
          if-no-files-found: warn

  domain-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Verify domain suite and coverage
        run: VERIFY_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" bash scripts/ci.sh test domain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domain-test-results
          path: artifacts/verification/domain/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domain-coverage-report
          path: artifacts/verification/domain-coverage/
          if-no-files-found: warn

  application-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Verify application suite and coverage
        run: VERIFY_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" bash scripts/ci.sh test application
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-test-results
          path: artifacts/verification/application/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-coverage-report
          path: artifacts/verification/application-coverage/
          if-no-files-found: warn

  infrastructure-tests:
    # Use the Mongo-compatible runner validated by Users; record the actual kernel in ci.sh.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Verify infrastructure suite and coverage
        run: VERIFY_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" bash scripts/ci.sh test infrastructure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrastructure-test-results
          path: artifacts/verification/infrastructure/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrastructure-coverage-report
          path: artifacts/verification/infrastructure-coverage/
          if-no-files-found: warn

  external-providers-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Verify external-providers suite
        run: VERIFY_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" bash scripts/ci.sh test external-providers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-providers-test-results
          path: artifacts/verification/external-providers/
          if-no-files-found: warn

  acceptance-tests:
    # Match the runner used by the real MongoDB integration suite.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Verify acceptance suite
        run: VERIFY_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" bash scripts/ci.sh test acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-test-results
          path: artifacts/verification/acceptance/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-allure-results
          path: artifacts/allure-results/acceptance/
          if-no-files-found: error
          retention-days: 7

  documentation-bundle:
    needs: [build, acceptance-tests]
    uses: MichalBoczula/ECommerceStore.LiveDocs/.github/workflows/package-producer.yml@01631ab47e49c6f7411bfb9dbe1328c6e40e21fe
    with:
      tooling-ref: 01631ab47e49c6f7411bfb9dbe1328c6e40e21fe
      project: invoices
      features: tests/ECommerceStoreInvoice.Acceptance.Tests/Features

  archive-documentation:
    if: ${{ always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.quality-gate.result == 'success' && needs.docker-image.result == 'success' }}
    needs: [quality-gate, docker-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACCOUNT: ${{ vars.LIVEDOCS_STORAGE_ACCOUNT || 'stecproductsdevmb261013' }}
      DOC_VERSION: ${{ vars.LIVEDOCS_VERSION || 'v1' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: documentation-bundle
          path: artifacts
      - name: Upload verified documentation bundle and receipt
        shell: bash
        env:
          AZURE_STORAGE_SAS_TOKEN: ${{ secrets.LIVEDOCS_STORAGE_SAS_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "$AZURE_STORAGE_SAS_TOKEN" || { echo 'Missing secret: LIVEDOCS_STORAGE_SAS_TOKEN' >&2; exit 1; }
          [[ "$ACCOUNT" =~ ^[a-z0-9]{3,24}$ ]] || { echo 'Invalid LiveDocs storage account' >&2; exit 1; }
          [[ "$DOC_VERSION" =~ ^v[1-9][0-9]*$ ]] || { echo 'Invalid LiveDocs version' >&2; exit 1; }

          bundle=artifacts/documentation-bundle.zip
          metadata="$RUNNER_TEMP/documentation-metadata.json"
          unzip -p "$bundle" bundle.json > "$metadata"
          jq -e --arg repository "$SOURCE_REPOSITORY" --arg commit "$SOURCE_COMMIT" --argjson run "$SOURCE_RUN_ID" \
            '.schemaVersion == 1 and .project == "invoices" and .repository == $repository and .commitSha == $commit and .workflowRunId == $run and (.generatedAt | type == "string")' \
            "$metadata" > /dev/null
          digest=$(sha256sum "$bundle" | cut -d ' ' -f 1)
          size=$(stat -c %s "$bundle")
          bundle_name="reports/invoices/$SOURCE_COMMIT/$digest.zip"
          receipt_name="candidates/$DOC_VERSION/invoices/$SOURCE_RUN_ID-$digest.json"
          bundle_url="https://$ACCOUNT.blob.core.windows.net/livedocs/$bundle_name"
          receipt=artifacts/documentation-reference.json
          jq --arg version "$DOC_VERSION" --arg url "$bundle_url" --arg digest "$digest" --argjson size "$size" \
            '{schemaVersion: 1, version: $version, reference: {project: .project, commitSha: .commitSha, generatedAt: .generatedAt, workflowRunId: .workflowRunId, artifact: {url: $url, sha256: $digest, sizeBytes: $size}}}' \
            "$metadata" > "$receipt"

          storage=(--account-name "$ACCOUNT" --container-name livedocs --sas-token "$AZURE_STORAGE_SAS_TOKEN" --only-show-errors)
          upload_once() {
            local file="$1" name="$2" content_type="$3" exists existing
            exists=$(az storage blob exists "${storage[@]}" --name "$name" --query exists --output tsv)
            case "$exists" in
              true|True)
                existing="$RUNNER_TEMP/existing-$(basename "$file")"
                az storage blob download "${storage[@]}" --name "$name" --file "$existing" --overwrite true --output none
                cmp --silent "$file" "$existing" || { echo "Immutable Blob has different bytes: $name" >&2; return 1; }
                ;;
              false|False)
                az storage blob upload "${storage[@]}" --name "$name" --file "$file" --content-type "$content_type" \
                  --overwrite false --if-none-match '*' --validate-content --output none
                ;;
              *) echo 'Unexpected Blob existence response' >&2; return 1 ;;
            esac
          }

          upload_once "$bundle" "$bundle_name" application/zip
          upload_once "$receipt" "$receipt_name" application/json
          printf 'Orders/Invoices documentation archived.\n\nBundle: %s\n\nReceipt: https://%s.blob.core.windows.net/livedocs/%s\n' \
            "$bundle_url" "$ACCOUNT" "$receipt_name" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-reference
          path: artifacts/documentation-reference.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  quality-gate:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build
      - domain-unit-tests
      - application-unit-tests
      - infrastructure-tests
      - external-providers-tests
      - acceptance-tests
      - documentation-bundle
      - secret-scan
      - dependency-review
    steps:
      - name: Require every mandatory job
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD: ${{ needs.build.result }}
          DOMAIN: ${{ needs.domain-unit-tests.result }}
          APPLICATION: ${{ needs.application-unit-tests.result }}
          INFRASTRUCTURE: ${{ needs.infrastructure-tests.result }}
          EXTERNAL_PROVIDERS: ${{ needs.external-providers-tests.result }}
          ACCEPTANCE: ${{ needs.acceptance-tests.result }}
          DOCUMENTATION: ${{ needs.documentation-bundle.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
        run: |
          for job in BUILD DOMAIN APPLICATION INFRASTRUCTURE EXTERNAL_PROVIDERS ACCEPTANCE DOCUMENTATION SECRET_SCAN; do
            if [[ "${!job}" != success ]]; then
              echo "$job must succeed; actual result: ${!job}" >&2
              exit 1
            fi
          done
          expected=success
          if [[ "$EVENT_NAME" == push ]]; then expected=skipped; fi
          if [[ "$DEPENDENCY_REVIEW" != "$expected" ]]; then
            echo "Dependency Review must be $expected; actual result: $DEPENDENCY_REVIEW" >&2
            exit 1
          fi


  docker-image:
    if: ${{ always() && !cancelled() && needs.quality-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/ECommerceStoreInvoice.API/Dockerfile
          push: false
          load: true
          tags: ecommerce-store-invoice:ci
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ecommerce-store-invoice:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Record scanned image identity
        shell: bash
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' ecommerce-store-invoice:ci)"
          test -n "$image_id"
          echo "Scanned image ID: $image_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and publish the scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          repository=mb0101/ecommerce-store-invoice-api
          sha_tag="$repository:$GITHUB_SHA"
          latest_tag="$repository:latest"
          scanned_id="$(docker image inspect --format '{{.Id}}' ecommerce-store-invoice:ci)"

          docker tag ecommerce-store-invoice:ci "$sha_tag"
          docker tag ecommerce-store-invoice:ci "$latest_tag"
          test "$scanned_id" = "$(docker image inspect --format '{{.Id}}' "$sha_tag")"
          test "$scanned_id" = "$(docker image inspect --format '{{.Id}}' "$latest_tag")"

          docker push "$sha_tag" | tee "$RUNNER_TEMP/push-sha.log"
          docker push "$latest_tag" | tee "$RUNNER_TEMP/push-latest.log"
          sha_digest="$(awk '/digest: sha256:/ { print $3 }' "$RUNNER_TEMP/push-sha.log" | tail -n 1)"
          latest_digest="$(awk '/digest: sha256:/ { print $3 }' "$RUNNER_TEMP/push-latest.log" | tail -n 1)"
          test -n "$sha_digest"
          test "$sha_digest" = "$latest_digest"
          echo "Published $sha_tag and $latest_tag from image $scanned_id with digest $sha_digest" >> "$GITHUB_STEP_SUMMARY"


