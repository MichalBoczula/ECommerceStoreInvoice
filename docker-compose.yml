name: invoices

services:
  mongo-keyfile-init:
    image: busybox:latest
    restart: "no"
    user: root
    volumes:
      - mongo_keyfile:/mongo-keyfile
    command:
      - sh
      - -c
      - |
        if [ ! -f /mongo-keyfile/keyfile ]; then
          head -c 96 /dev/urandom \
            | base64 \
            | tr -d '\n' \
            > /mongo-keyfile/keyfile

          chown 999:999 /mongo-keyfile/keyfile
          chmod 400 /mongo-keyfile/keyfile
        fi

  mongodb:
    image: mongo:8.0
    container_name: invoices-mongodb
    restart: unless-stopped

    depends_on:
      mongo-keyfile-init:
        condition: service_completed_successfully

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db
      - mongo_keyfile:/etc/mongo-keyfile:ro

    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /etc/mongo-keyfile/keyfile

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh 'mongodb://admin:admin123@localhost:27017/admin?authSource=admin&directConnection=true' --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  mongo-init:
    image: mongo:8.0
    container_name: invoices-mongodb-replica-init
    restart: "no"

    depends_on:
      mongodb:
        condition: service_healthy

    entrypoint:
      - /bin/bash
      - -c

    command:
      - |
        MONGO_URI="mongodb://admin:admin123@mongodb:27017/admin?authSource=admin&directConnection=true"

        mongosh "$$MONGO_URI" --quiet --eval '
          try {
            rs.status();
            print("Replica set is already initialized.");
          } catch (error) {
            print("Initializing replica set...");

            rs.initiate({
              _id: "rs0",
              members: [
                {
                  _id: 0,
                  host: "mongodb:27017"
                }
              ]
            });
          }
        '

        for attempt in {1..30}; do
          IS_PRIMARY=$$(mongosh "$$MONGO_URI" --quiet --eval '
            try {
              print(db.hello().isWritablePrimary);
            } catch (error) {
              print(false);
            }
          ')

          if [ "$$IS_PRIMARY" = "true" ]; then
            echo "MongoDB replica set is ready."
            exit 0
          fi

          echo "Waiting for MongoDB primary..."
          sleep 2
        done

        exit 1

  ecommercestoreinvoice.api:
    image: ${DOCKER_REGISTRY-}ecommercestoreinvoiceapi
    container_name: invoices-api

    build:
      context: .
      dockerfile: src/ECommerceStoreInvoice.API/Dockerfile
      args:
        BUILD_CONFIGURATION: Release

    restart: unless-stopped

    depends_on:
      mongo-init:
        condition: service_completed_successfully

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_HTTP_PORTS: 8080
      MongoDbSettings__ConnectionString: mongodb://admin:admin123@mongodb:27017/?authSource=admin&replicaSet=rs0
      MongoDbSettings__DatabaseName: ecommerce-store-invoice-db
      MongoDbSettings__ShoppingCartsCollectionName: shopping-carts
      MongoDbSettings__OrdersCollectionName: orders
      MongoDbSettings__ProductVersionsCollectionName: product-versions
      MongoDbSettings__InvoicesCollectionName: invoices

    ports:
      - "8080:8080"

    shm_size: "2gb"

volumes:
  mongo_data:
  mongo_keyfile: